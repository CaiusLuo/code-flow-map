<html lang="en">

<style>
  :root {

  .wrap { inline-size: min(100%, 93rem); margin-inline: auto; padding-inline: clamp(1rem, 3.6vw, 3.5rem); }
  .app-bar { background: var(--panel); border-block-end: 1px solid var(--divider); }
  .app-bar > .wrap { min-block-size: 3.5rem; display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  .brand { display: flex; align-items: center; gap: .7rem; font-weight: 650; letter-spacing: -.015em; }
  .brand-mark { inline-size: 1.55rem; aspect-ratio: 1; display: grid; place-content: center; border: 1px solid var(--divider); border-radius: .45rem; background: var(--surface); }
  .brand-mark::before { content: ""; inline-size: .62rem; block-size: .62rem; border: 1px solid var(--muted); border-radius: .12rem; box-shadow: .15rem .15rem 0 -.035rem var(--surface), .15rem .15rem 0 0 var(--muted); transform: translate(-.075rem, -.075rem); }
  .revision { display: flex; align-items: center; gap: .55rem; color: var(--muted); font-size: .75rem; white-space: nowrap; }
  .revision :is(span, a) { font-family: var(--mono); text-decoration: none; color: inherit; padding: .18rem .42rem; border: 1px solid var(--divider); border-radius: .35rem; }
  .revision a:hover { color: var(--accent); }
  .page { padding-block: clamp(1.35rem, 4.6vh, 3rem) 1.25rem; }
  .intro { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem; margin-block-end: 1.3rem; }
  .intro h1 { margin: 0; font-size: clamp(1.75rem, 1.25rem + 1.6vw, 2.55rem); font-weight: 690; line-height: 1.22; letter-spacing: -.045em; }
  .intro p { margin: .45rem 0 0; color: var(--muted); }
  .scenarios { display: flex; gap: .125rem; padding: .19rem; background: var(--canvas); border: 1px solid var(--divider); border-radius: .62rem; }
  .scenarios[hidden] { display: none; }
  .scenarios button { background: transparent; border: 1px solid transparent; border-radius: .43rem; color: var(--muted); min-block-size: 1.85rem; padding-inline: .65rem; white-space: nowrap; font-size: .78rem; }
  .scenarios button:hover { color: var(--text); }
  .scenarios button[aria-pressed="true"] { color: var(--text); background: var(--panel); border-color: var(--divider); box-shadow: 0 1px 2px #0001; font-weight: 620; }
  .workbench { display: grid; grid-template-columns: minmax(0, 1.16fr) minmax(0, 1fr); min-block-size: 39rem; block-size: calc(100vh - 15.5rem); block-size: calc(100dvh - 15.5rem); border: 1px solid var(--divider); border-radius: .95rem; background: var(--panel); box-shadow: var(--shadow); }
  .pane { min-inline-size: 0; min-block-size: 0; display: flex; flex-direction: column; }
  .flow-pane { border-inline-start: 1px solid var(--divider); }
  .pane-bar { min-block-size: 3.2rem; display: flex; align-items: center; justify-content: space-between; gap: .6rem; padding: .43rem 1rem; border-block-end: 1px solid var(--divider); }
  .pane-bar h2 { font-size: .88rem; font-weight: 670; white-space: nowrap; margin: 0; }
  .file-select { max-inline-size: 73%; min-block-size: 1.85rem; padding-inline: .45rem .3rem; background: var(--surface); border: 1px solid var(--divider); border-radius: .42rem; font: .74rem var(--mono); }
  .file-path { display: flex; align-items: center; min-block-size: 2.1rem; padding-inline: 1rem; border-block-end: 1px solid var(--divider); color: var(--muted); background: var(--surface); font: .68rem var(--mono); overflow-wrap: anywhere; }
  .code-scroll { position: relative; flex: 1; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; outline-offset: -2px !important; }
  .code { display: block; min-inline-size: 100%; inline-size: max-content; padding-block: .85rem; font: .77rem/1.5rem var(--mono); tab-size: 2; white-space: pre; }
  .code-line { display: flex; min-block-size: 1.5rem; align-items: baseline; }
  .code-line[data-ref] { cursor: pointer; }
  .code-line[data-ref]:hover { background: var(--surface); }
  .code-line.is-in-range { background: var(--range); }
  .code-line.is-in-range:hover, .code-line.is-anchor { background: var(--active); }
  .gutter { position: sticky; inset-inline-start: 0; z-index: 1; flex: none; inline-size: 4.1rem; padding: 0 .86rem 0 .25rem; border: 0; text-align: end; background: var(--panel); font: inherit; color: var(--muted); user-select: none; }
  button.gutter { min-block-size: 24px; color: var(--accent); }
  button.gutter::before { position: absolute; content: ""; inline-size: .28rem; aspect-ratio: 1; border-radius: 50%; background: currentColor; inset-inline-start: .63rem; inset-block-start: calc(50% - .14rem); }
  .code-line[data-ref]:hover .gutter { background: var(--surface); }
  .is-in-range .gutter { background: var(--range); box-shadow: inset 2px 0 var(--accent-border); }
  .is-in-range:hover .gutter, .is-anchor .gutter { background: var(--active); }
  .is-anchor .gutter { box-shadow: inset 2px 0 var(--accent); }
  .gutter:focus-visible { outline-offset: -2px; }
  .line-text { padding-inline-end: 1.2rem; user-select: text; }
  .code-status { min-block-size: 2.15rem; display: flex; align-items: center; justify-content: space-between; gap: .55rem; padding-inline: 1rem; border-block-start: 1px solid var(--divider); color: var(--muted); font-size: .69rem; }
  .code-status output { font-family: var(--mono); }
  .jump { display: none; background: none; color: var(--accent); border: 0; min-block-size: 1.6rem; padding-inline: .25rem; font-size: .73rem; }
  .player { display: flex; align-items: center; gap: .22rem; }
  .player button { display: inline-flex; justify-content: center; align-items: center; gap: .38rem; min-inline-size: 1.7rem; min-block-size: 1.8rem; padding: 0 .38rem; border: 1px solid transparent; border-radius: .38rem; background: transparent; }
  .player button:hover:not(:disabled) { background: var(--surface); }
  .player output { text-align: center; min-inline-size: 3.1rem; color: var(--muted); font-variant-numeric: tabular-nums; font-size: .73rem; }
  .player .play { background: var(--surface); border-color: var(--divider); font-size: .74rem; padding-inline: .54rem; margin-inline-start: .3rem; }
  .player .play:hover { border-color: var(--accent-border); color: var(--accent); }
  .chevron { inline-size: .39rem; block-size: .39rem; border-block-start: 1.5px solid; border-inline-end: 1.5px solid; transform: rotate(45deg); }
  .back { transform: rotate(-135deg); }
  .play-symbol { display: inline-block; inline-size: 0; border: .23rem solid transparent; border-inline-start: .36rem solid currentColor; border-inline-end: 0; }
  .play[data-playing] .play-symbol { inline-size: .39rem; block-size: .52rem; border: solid currentColor; border-width: 0 .11rem; }
  .flow-stage { flex: 1; display: grid; align-items: center; min-block-size: 0; background: var(--surface); padding: .9rem clamp(.55rem, 1.6vw, 1.4rem); }
  .graph { position: relative; display: grid; grid-template-columns: minmax(0, 1.38fr) minmax(0, 1fr); grid-auto-rows: minmax(2.55rem, auto); column-gap: clamp(1.3rem, 3.1vw, 2.6rem); row-gap: .72rem; padding-inline: 1.38rem .85rem; max-inline-size: 34rem; inline-size: 100%; margin-inline: auto; }
  .graph[data-single-lane] { grid-template-columns: minmax(0, 1fr); max-inline-size: 22rem; }
  .edges { position: absolute; inset: 0; pointer-events: none; inline-size: 100%; block-size: 100%; }
  .node { position: relative; display: flex; flex-direction: column; align-items: start; justify-content: center; gap: .07rem; min-inline-size: 0; min-block-size: 2.55rem; padding: .26rem .62rem; text-align: start; background: var(--panel); border: 1px solid var(--divider); border-radius: .56rem; transition: background-color .15s, border-color .15s; }
  .node:hover { border-color: var(--edge); }
  .node[aria-pressed="true"] { border-color: var(--accent-border); background: var(--active); }
  .node[data-visited]:not([aria-pressed="true"]) { border-color: var(--accent-border); }
  .node-title { display: flex; gap: .36rem; align-items: center; font-size: .81rem; font-weight: 630; line-height: 1.24; }
  .node[aria-pressed="true"] .node-title { color: var(--accent); }
  .node-title::before { content: ""; flex: none; inline-size: .43rem; aspect-ratio: 1; border: 1px solid var(--edge); border-radius: 50%; }
  .node[data-kind="branch"] .node-title::before { border-radius: .07rem; transform: rotate(45deg); }
  .node:is([aria-pressed="true"], [data-visited]) .node-title::before { background: var(--accent); border-color: var(--accent); }
  .node-symbol { max-inline-size: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline-start: .79rem; font: .66rem/1.2 var(--mono); color: var(--muted); }
  .inspector { min-block-size: 7.6rem; padding: .62rem 1rem .76rem; border-block-start: 1px solid var(--divider); }
  .inspector h3 { margin: 0; font-size: .84rem; font-weight: 680; }
  .inspector p { margin: .2rem 0 .37rem; color: var(--muted); font-size: .75rem; }
  .source-links { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .46rem; }
  .source-links button { color: var(--accent); background: var(--surface); border: 1px solid var(--divider); border-radius: .32rem; padding: .12rem .34rem; min-block-size: 24px; font: .67rem var(--mono); }
  .source-links button:hover, .source-links button[aria-pressed="true"] { background: var(--active); border-color: var(--accent-border); }
  .status-caption { color: var(--muted); margin: .62rem 0 0; font-size: .72rem; }
  @media (max-width: 56rem) {
    .pane-bar { padding-inline: .75rem; }
    .flow-stage { padding-inline: .45rem; }
    .graph { column-gap: 1.4rem; }
    .inspector { padding-inline: .75rem; }
  }
  @media (max-width: 47rem) {
    .app-bar > .wrap { min-block-size: 3.2rem; }
    .workbench { grid-template-columns: minmax(0, 1fr); block-size: auto; min-block-size: 0; }
    .source-pane { block-size: clamp(23rem, 58vh, 36rem); block-size: clamp(23rem, 58dvh, 36rem); }
    .flow-pane { border-inline-start: 0; border-block-start: 1px solid var(--divider); }
    .pane { scroll-margin-block: .75rem; }
    .jump { display: inline-block; }
    .node { min-block-size: 2.7rem; }
    .intro { margin-block-end: 1rem; }
  }
  @media (max-width: 24rem) {
    .graph { padding-inline: 1.05rem .7rem; column-gap: 1.2rem; }
    .node { padding-inline: .4rem; }
    .node-symbol { font-size: .6rem; }
    .gutter { inline-size: 3.45rem; }
  }
  @media (prefers-reduced-motion: reduce) { .node { transition: none; } }
</style>

<body>
<header class="app-bar">
  <div class="wrap">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span id="project"></span></div>
    <div class="revision" id="revision-slot"></div>
  </div>
</header>
<main class="page wrap">
  <div class="intro">
    <div>
      <h1 id="workflow-title"></h1>
      <p data-text="instructions"></p>
    </div>
    <div class="scenarios" id="scenarios" role="group" data-label="routes"></div>
  </div>
  <div class="workbench">
    <section class="pane source-pane" id="source-pane" aria-labelledby="source-heading">
      <header class="pane-bar">
        <h2 id="source-heading" data-text="source"></h2>
        <select class="file-select" id="file-select" data-label="file"></select>
      </header>
      <div class="file-path" id="file-path"></div>
      <div class="code-scroll" id="code-scroll" role="region" data-label="code" tabindex="0">
        <code class="code" id="code"></code>
      </div>
      <footer class="code-status">
        <output id="line-status" aria-live="off"></output>
        <button class="jump" type="button" id="show-flow" data-text="showFlow"></button>
      </footer>
    </section>
    <section class="pane flow-pane" id="flow-pane" aria-labelledby="flow-heading">
      <header class="pane-bar">
        <h2 id="flow-heading" data-text="flow"></h2>
        <div class="player" role="group" data-label="player">
          <button id="previous" type="button" data-label="previous"><span class="chevron back" aria-hidden="true"></span></button>
          <output id="position" data-label="position" aria-live="off"></output>
          <button id="next" type="button" data-label="next"><span class="chevron" aria-hidden="true"></span></button>
          <button class="play" id="play" type="button"><span class="play-symbol" aria-hidden="true"></span><span id="play-label"></span></button>
        </div>
      </header>
      <div class="flow-stage">
        <div class="graph" id="graph" role="group" data-label="nodes">
          <canvas class="edges" id="edges" aria-hidden="true"></canvas>
        </div>
      </div>
      <footer class="inspector">
        <h3 id="detail-title"></h3>
        <p id="detail-text"></p>
        <div class="source-links" id="detail-links" role="group" data-label="refs"></div>
      </footer>
    </section>
  </div>
  <p class="status-caption" data-text="caption"></p>
</main>
<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script>
'use strict';

const snapshot = JSON.parse(document.getElementById('snapshot').textContent);
const byId = id => document.getElementById(id);
const { files, nodes, routes, edges } = snapshot;
const nodeById = new Map(nodes.map(node => [node.id, node]));
const references = nodes.flatMap(node => node.refs.map((ref, index) => ({ ...ref, node, index })));
const labels = snapshot.language === 'zh' ? {
  instructions: '点击流程节点定位源码，点击带蓝点的行号返回流程。',
  source: '源码', file: '源文件', code: '源文件内容', showFlow: '查看流程',
  flow: '执行流程', routes: '演示路径', player: '流程播放', previous: '上一步',
  position: '演示进度', next: '下一步', nodes: '流程节点', refs: '相关源码',
  caption: '基于源码的路径演示。', working: '工作文件', play: '播放', pause: '暂停', replay: '重播',
  lineJump: (line, title) => '第 ' + line + ' 行，定位到' + title,
} : {
  instructions: 'Select a node to jump to source. Select a dotted line number to jump back.',
  source: 'Source', file: 'Source file', code: 'Source contents', showFlow: 'View flow',
  flow: 'Execution flow', routes: 'Demo paths', player: 'Playback', previous: 'Previous step',
  position: 'Playback position', next: 'Next step', nodes: 'Flow nodes', refs: 'Source references',
  caption: 'Source-based walkthrough.', working: 'Working files', play: 'Play', pause: 'Pause', replay: 'Replay',
  lineJump: (line, title) => 'Line ' + line + ', show ' + title,
};
document.documentElement.lang = snapshot.language === 'zh' ? 'zh-CN' : 'en';
document.title = snapshot.project + ' · ' + snapshot.title;
byId('project').textContent = snapshot.project;
byId('workflow-title').textContent = snapshot.title;
for (const element of document.querySelectorAll('[data-text]')) element.textContent = labels[element.dataset.text];
for (const element of document.querySelectorAll('[data-label]')) element.setAttribute('aria-label', labels[element.dataset.label]);

const initialRoute = Math.max(0, routes.findIndex(route => route.steps.includes(snapshot.focus)));
const routeButtons = routes.map((route, index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = route.name;
  button.setAttribute('aria-pressed', String(index === initialRoute));
  byId('scenarios').append(button);
  return button;
});
byId('scenarios').hidden = routes.length === 1;
const sourceSelect = byId('file-select');
const code = byId('code');
const codeScroll = byId('code-scroll');
const graph = byId('graph');
graph.toggleAttribute('data-single-lane', nodes.every(node => node.column === 1));
const lineReferences = new Map(Object.keys(files).map(path => [path, new Map()]));
for (const [index, ref] of references.entries()) {
  for (let line = ref.start; line <= ref.end; line += 1) lineReferences.get(ref.file).set(line, index);
}
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const darkMode = matchMedia('(prefers-color-scheme: dark)');
const narrowLayout = matchMedia('(max-width: 47rem)');
const nodeButtons = new Map();
const previous = byId('previous');
const next = byId('next');
const play = byId('play');

let routeIndex = initialRoute;
let cursor = Math.max(0, activeRoute().indexOf(snapshot.focus));
let activeNode;
let activeRef;
let activeLine;
let fileName;
let highlighted = [];
let timer = null;
let traversed = false;
let frame = 0;

const revisionLabel = document.createElement(snapshot.repository ? 'a' : 'span');
revisionLabel.id = 'revision';
const shortRevision = snapshot.revision?.slice(0, 10);
revisionLabel.textContent = shortRevision ?? labels.working;
if (snapshot.revision) revisionLabel.title = snapshot.revision;
if (snapshot.repository) {
  revisionLabel.href = 'https://github.com/' + snapshot.repository + '/commit/' + snapshot.revision;
  revisionLabel.textContent = 'GitHub · ' + shortRevision;
}
byId('revision-slot').append(revisionLabel);

for (const [name, file] of Object.entries(files)) {
  sourceSelect.add(new Option(file.path.split('/').at(-1), name));
}

for (const node of nodes) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'node';
  button.dataset.kind = node.kind;
  button.style.gridArea = node.row + ' / ' + node.column;
  const title = document.createElement('span');
  title.className = 'node-title';
  title.textContent = node.title;
  const symbol = document.createElement('span');
  symbol.className = 'node-symbol';
  symbol.textContent = node.symbol;
  symbol.title = node.symbol;
  button.append(title, symbol);
  button.addEventListener('click', () => inspect(node, 0, undefined, narrowLayout.matches));
  graph.append(button);
  nodeButtons.set(node.id, button);
}

function activeRoute() {
  return routes[routeIndex].steps;
}

function displaySource(name) {
  if (fileName === name) return;
  highlighted = [];
  fileName = name;
  const file = files[name];
  sourceSelect.value = name;
  byId('file-path').textContent = file.path;
  const fragment = document.createDocumentFragment();
  const refs = lineReferences.get(name);
  for (const [offset, content] of file.lines.entries()) {
    const number = offset + 1;
    const refIndex = refs.get(number);
    const ref = references[refIndex];
    const row = document.createElement('span');
    row.className = 'code-line';
    if (ref) {
      row.dataset.ref = refIndex;
      row.dataset.line = number;
    }
    const isAnchor = ref?.start === number;
    const gutter = document.createElement(isAnchor ? 'button' : 'span');
    gutter.className = 'gutter';
    gutter.textContent = number;
    if (isAnchor) {
      gutter.type = 'button';
      gutter.setAttribute('aria-label', labels.lineJump(number, ref.node.title));
      gutter.title = ref.node.title;
    } else {
      gutter.setAttribute('aria-hidden', 'true');
    }
    const line = document.createElement('span');
    line.className = 'line-text';
    line.textContent = content;
    row.append(gutter, line);
    fragment.append(row);
  }
  code.replaceChildren(fragment);
  codeScroll.scrollTo(0, 0);
}

function displayReference(ref, line) {
  displaySource(ref.file);
  for (const row of highlighted) row.classList.remove('is-in-range', 'is-anchor');
  highlighted = [];
  for (let n = ref.start; n <= ref.end; n += 1) {
    const row = code.children[n - 1];
    row.classList.add('is-in-range');
    if (n === line) row.classList.add('is-anchor');
    highlighted.push(row);
  }
  const row = code.children[line - 1];
  codeScroll.scrollTo({ top: Math.max(0, row.offsetTop - row.offsetHeight * 4) });
  byId('line-status').textContent = ref.start === ref.end ? 'L' + ref.start : 'L' + ref.start + '–' + ref.end;
}

function drawInspector(resetLinks) {
  byId('detail-title').textContent = activeNode.title;
  byId('detail-text').textContent = activeNode.description;
  const links = byId('detail-links');
  if (resetLinks) {
    links.replaceChildren(...activeNode.refs.map((ref, index) => {
      const link = document.createElement('button');
      link.type = 'button';
      link.textContent = files[ref.file].path.split('/').at(-1) + ':' + ref.start;
      link.title = ref.label;
      link.setAttribute('aria-label', ref.label + ' ' + link.textContent);
      link.addEventListener('click', () => inspect(activeNode, index, undefined, narrowLayout.matches));
      return link;
    }));
  }
  for (const [index, link] of [...links.children].entries()) {
    link.setAttribute('aria-pressed', String(index === activeRef));
  }
}

function updateControls() {
  const current = cursor >= 0 ? cursor + 1 : '—';
  byId('position').textContent = current + ' / ' + activeRoute().length;
  previous.disabled = cursor === 0;
  next.disabled = cursor === activeRoute().length - 1;
  play.toggleAttribute('data-playing', timer !== null);
  byId('play-label').textContent = timer !== null ? labels.pause : cursor === activeRoute().length - 1 ? labels.replay : labels.play;
}

function renderSelection(node, index = 0, line = node.refs[index].start) {
  const resetLinks = activeNode !== node;
  activeNode = node;
  activeRef = index;
  activeLine = line;
  displayReference(node.refs[index], line);
  const visited = new Set(traversed && cursor >= 0 ? activeRoute().slice(0, cursor + 1) : []);
  for (const [id, button] of nodeButtons) {
    button.setAttribute('aria-pressed', String(id === node.id));
    button.toggleAttribute('data-visited', visited.has(id));
  }
  drawInspector(resetLinks);
  updateControls();
  scheduleEdges();
}

function stopPlayback() {
  clearInterval(timer);
  timer = null;
  updateControls();
}

function inspect(node, index, line, jumpToSource = false) {
  stopPlayback();
  if (activeRoute()[cursor] !== node.id) cursor = activeRoute().indexOf(node.id);
  renderSelection(node, index, line);
  if (jumpToSource) showPane('source-pane', code.children[activeLine - 1].querySelector('button') ?? codeScroll);
}

function showPane(id, focus) {
  byId(id).scrollIntoView({ block: 'start', behavior: reducedMotion.matches ? 'auto' : 'smooth' });
  focus.focus({ preventScroll: true });
}

function stepTo(position) {
  cursor = position;
  traversed = true;
  renderSelection(nodeById.get(activeRoute()[cursor]));
}

function advance() {
  if (cursor < activeRoute().length - 1) stepTo(cursor + 1);
  if (cursor === activeRoute().length - 1) stopPlayback();
}

sourceSelect.addEventListener('change', event => {
  const first = references.filter(ref => ref.file === event.target.value).sort((a, b) => a.start - b.start)[0];
  inspect(first.node, first.index);
});

code.addEventListener('click', event => {
  const row = event.target.closest('.code-line[data-ref]');
  if (!row || (event.target.tagName !== 'BUTTON' && !getSelection().isCollapsed)) return;
  const ref = references[Number(row.dataset.ref)];
  inspect(ref.node, ref.index, Number(row.dataset.line));
  if (narrowLayout.matches) showPane('flow-pane', nodeButtons.get(ref.node.id));
});

byId('show-flow').addEventListener('click', () => showPane('flow-pane', nodeButtons.get(activeNode.id)));

for (const [index, button] of routeButtons.entries()) {
  button.addEventListener('click', () => {
    if (routeIndex === index) return;
    stopPlayback();
    routeIndex = index;
    cursor = 0;
    traversed = false;
    for (const option of routeButtons) option.setAttribute('aria-pressed', String(option === button));
    renderSelection(nodeById.get(activeRoute()[0]));
  });
}

previous.addEventListener('click', () => {
  stopPlayback();
  stepTo(Math.max(0, cursor - 1));
});
next.addEventListener('click', () => {
  stopPlayback();
  advance();
});
play.addEventListener('click', () => {
  if (timer !== null) {
    stopPlayback();
    return;
  }
  if (cursor < 0 || cursor === activeRoute().length - 1) stepTo(0);
  timer = setInterval(advance, 1100);
  updateControls();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopPlayback(); });

function scheduleEdges() {
  cancelAnimationFrame(frame);
  frame = requestAnimationFrame(drawEdges);
}

function edgePoints(edge, a, b, width) {
  const mx = box => (box.left + box.right) / 2;
  const my = box => (box.top + box.bottom) / 2;
  switch (edge.kind) {
    case 'side': return [[a.right, my(a)], [b.left - 2, my(b)]];
    case 'retry': {
      const outside = width - 3;
      return [[a.right, my(a)], [outside, my(a)], [outside, my(b)], [b.right + 2, my(b)]];
    }
    case 'tool-join': {
      const mid = (b.right + a.left) / 2;
      const y = (a.bottom + b.top) / 2;
      return [[mx(a), a.bottom], [mx(a), y], [mid, y], [mid, my(b)], [b.right + 2, my(b)]];
    }
    case 'loop': return [[a.left, my(a)], [3, my(a)], [3, my(b)], [b.left - 2, my(b)]];
    case 'skip': {
      const lane = a.right + 9;
      return [[a.right, my(a)], [lane, my(a)], [lane, my(b)], [b.right + 2, my(b)]];
    }
    default: return [[mx(a), a.bottom], [mx(b), b.top - 2]];
  }
}

function drawEdges() {
  const canvas = byId('edges');
  const { width, height, left, top } = graph.getBoundingClientRect();
  const ratio = devicePixelRatio || 1;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  const styles = getComputedStyle(graph);
  const route = activeRoute();
  const segments = route.slice(1).map((id, i) => route[i] + '/' + id);
  const visited = traversed ? segments.slice(0, Math.max(0, cursor)) : [];
  const bounds = id => {
    const box = nodeButtons.get(id).getBoundingClientRect();
    return { left: box.left - left, right: box.right - left, top: box.top - top, bottom: box.bottom - top };
  };
  const records = edges.map(edge => {
    const key = edge.from + '/' + edge.to;
    const state = visited.includes(key) ? 2 : segments.includes(key) ? 1 : 0;
    return { edge, state };
  });
  for (const { edge, state } of records.sort((a, b) => a.state - b.state)) {
    const points = edgePoints(edge, bounds(edge.from), bounds(edge.to), width);
    const color = styles.getPropertyValue(['--quiet-edge', '--edge', '--accent'][state]).trim();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = state === 2 ? 1.6 : 1.15;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.setLineDash(state === 0 ? [2.4, 3.5] : []);
    ctx.beginPath();
    ctx.moveTo(...points[0]);
    for (const point of points.slice(1)) ctx.lineTo(...point);
    ctx.stroke();
    const [x, y] = points.at(-1);
    const [px, py] = points.at(-2);
    const angle = Math.atan2(y - py, x - px);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - 5 * Math.cos(angle - .55), y - 5 * Math.sin(angle - .55));
    ctx.lineTo(x - 5 * Math.cos(angle + .55), y - 5 * Math.sin(angle + .55));
    ctx.closePath();
    ctx.fill();
  }
}

new ResizeObserver(scheduleEdges).observe(graph);
darkMode.addEventListener('change', scheduleEdges);
renderSelection(nodeById.get(activeRoute()[cursor]));
</script>
</body>
</html>
